[package]
name = "bible-io"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "A Rust library for working with Bible text data structures"
authors = ["Moty Fainer"]
license = "AGPL-3.0-only"
repository = "https://github.com/m0ty/bible-json-package-rs"
keywords = ["bible", "scripture", "text-processing"]
categories = ["text-processing", "parsing"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
simd-json = { version = "0.17.3", features = ["serde_impl"] }
indexmap = { version = "2.14.0", features = ["serde"] }
bible-io-references = "1.1.0"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
