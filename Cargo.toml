[package]
name = "bible-io"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust library for working with Bible text data structures"
authors = ["Moty Fainer"]
license = "AGPL-3.0-only"
repository = "https://github.com/m0ty/bible-json-package-rs"
readme = "README.md"
keywords = ["bible", "scripture", "text-processing"]
categories = ["text-processing", "parsing"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
bible-io-references = "1.1.1"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
unicode-normalization = "0.1.24"
unicode-segmentation = "=1.13.3"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
